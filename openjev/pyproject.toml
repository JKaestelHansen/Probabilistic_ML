[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openjev"
version = "0.1.0"
description = "Open-source typed decision models (choice / score / yes-no) with calibrated probabilities, for images and text"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch>=2.1"]

[project.optional-dependencies]
hf = ["transformers>=4.56", "pillow", "accelerate"]
api = ["fastapi", "uvicorn", "pillow"]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["openjev*"]
